[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    architecture: import-boundary and SDK-isolation contract checks
    characterization: accepted-behavior snapshots of the pre-migration code
    regression: Phase 1 behavior-preserving regression suites
    integration: suites run against real disposable adapters (Postgres/Qdrant)
    contract: shared fake/real adapter behaviour contracts (spec 04)
    performance: opt-in real-environment latency records (spec 20; skipped without SABHA_PERF_BASE_URL)
# Note: app models use pydantic v1-style `class Config` (PydanticDeprecatedSince20).
# Not a Spec 01 finding; do not turn deprecations into errors here.
